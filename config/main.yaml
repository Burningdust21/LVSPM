defaults:
  - dataset: training_dl3dv
  - optional dataset/view_sampler_dataset_specific_config: ${dataset/view_sampler}_${dataset}
  - model/encoder: lvspm
  - _self_
  - loss: []

wandb:
  project: lvspm
  entity: null
  name: lvspm
  mode: disabled
  id: null

mode: train
tfboard_dir: null
compile_model: false
loss: {}
dataset:
  supervision: image



data_loader:
  dynamic_sampler:
    enable: false
    total_frames_per_gpu: 48
    possible_v: [2, 3, 4, 6, 8, 12, 16, 24]
    weights: null
  # Avoid having to spin up new processes to print out visualizations.
  train:
    num_workers: 10
    persistent_workers: true
    batch_size: 4
    seed: 1234
  test:
    num_workers: 1
    persistent_workers: false
    batch_size: 1
    seed: 2345
  val:
    num_workers: 1
    persistent_workers: true
    batch_size: 1
    seed: 3456

optimizer:
  lr: 1.e-4
  grad_clip: 0.99
  grad_clip_steps: -1
  weight_decay: 0.0
  scale_lr: true

checkpointing:
  load: null
  every_n_train_steps: 5000  # 5000
  save_top_k: -1

train:
  extended_visualization: false
  print_log_every_n_steps: 1


test:
  output_path: 1gpu_run
  compute_scores: false
  eval_time_skip_steps: 0

seed: 111123

trainer:
  max_steps: -1
  val_check_interval: 0.5
  num_sanity_val_steps: 2
  accumulate_grad_batches: 1

output_dir: output_runs/runs/default
finetune_from: null

# https://hydra.cc/docs/configure_hydra/workdir/#configuration-for-multirun
hydra:
  run:
    dir: ${output_dir}/config
